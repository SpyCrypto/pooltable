<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PoolTable — PTBL | SpyCrypto</title>
<meta name="description" content="PoolTable (PTBL): SpyCrypto-operated Cardano stake pool. BREAK THE BLOCK.">
<style>
  :root{
    --blue:#1da7fa; --blue-2:#0af; --stag:#29b6f6;
    --ink:#0c1220; --felt:#0f7a3d; --wood:#6b4a2b;
    --silver:#cfd6e0; --chrome:#e8edf3;
  }
  *{margin:0;box-sizing:border-box}
  body{
    font-family:"Arial Black","Arial Narrow",Arial,system-ui,sans-serif;
    color:#eef2f7; background:
      radial-gradient(1100px 560px at 22% -12%, #124a6e 0%, transparent 58%),
      radial-gradient(900px 500px at 82% 108%, #0e3a55 0%, transparent 55%),
      linear-gradient(180deg,#0b1224 0%,#060a14 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:3rem 1.5rem;
  }
  .logo{width:min(620px,94vw); max-width:620px}
  .logo svg{width:100%;height:auto;display:block}
  .rack{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:20px;margin-top:2.6rem}
  .ball{width:13px;height:13px;border-radius:50%;box-shadow:inset -2px -2px 3px rgba(0,0,0,.5)}
  .b1{background:#f5c518}.b2{background:var(--blue)}.b3{background:#e03e3e}.b4{background:#7b4fd8}
  .b5{background:#f28c28}.b6{background:#22a06b}.b8{background:#111;background-image:radial-gradient(circle at 35% 30%,#333,#000 70%)}
  .spy{margin-top:1.8rem;color:#cdd6e6;font-weight:300;letter-spacing:.35em;font-size:.78rem}
  .spy span{color:var(--stag)}
  .meta{margin-top:1.4rem;font-size:.76rem;color:#63708a;letter-spacing:.05em;font-family:system-ui,-apple-system,sans-serif}
  .meta code{color:#93a2bd}
</style>
</head>
<body>

  <!-- PoolTable lockup logo: starburst mark, chrome PTBL, POOLTABLE, BREAK THE BLOCK. -->
  <div class="logo" role="img" aria-label="PoolTable PTBL — SpyCrypto — BREAK THE BLOCK.">
    <svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.45" stop-color="#eef2f7"/>
          <stop offset="0.55" stop-color="#b9c2cf"/>
          <stop offset="1" stop-color="#7b8494"/>
        </linearGradient>
        <linearGradient id="chromeDeep" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dfe6ee"/>
          <stop offset="0.5" stop-color="#9aa5b4"/>
          <stop offset="1" stop-color="#5d6674"/>
        </linearGradient>
        <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0af"/>
          <stop offset="0.5" stop-color="#29b6f6"/>
          <stop offset="1" stop-color="#0af"/>
        </linearGradient>
        <filter id="soft" x="-40%" y="-60%" width="180%" height="240%">
          <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/>
        </filter>
      </defs>

      <!-- flanking blue bars -->
      <rect x="34"  y="150" width="150" height="9" rx="4.5" fill="url(#blueBar)" opacity="0.9"/>
      <rect x="456" y="150" width="150" height="9" rx="4.5" fill="url(#blueBar)" opacity="0.9"/>

      <!-- STARBURST / NETWORK MARK -->
      <g transform="translate(320,44)" stroke="#1e9cf0" stroke-width="3" stroke-linecap="round" fill="none">
        <circle cx="0" cy="0" r="9"  fill="#22a7ff" stroke="none"/>
        <circle cx="26" cy="-15" r="6"  fill="#22a7ff" stroke="none"/>
        <circle cx="-26" cy="-15" r="6" fill="#22a7ff" stroke="none"/>
        <circle cx="24" cy="22"  r="6" fill="#22a7ff" stroke="none"/>
        <circle cx="-24" cy="22"  r="6" fill="#22a7ff" stroke="none"/>
        <circle cx="0" cy="-32"  r="5" fill="#22a7ff" stroke="none"/>
        <circle cx="0" cy="34"   r="5" fill="#22a7ff" stroke="none"/>
        <path d="M0 0 L26 -15 M0 0 L-26 -15 M0 0 L24 22 M0 0 L-24 22"/>
        <path d="M0 -10 L0 -27 M0 10 L0 29"/>
      </g>

      <!-- chrome PTBL wordmark -->
      <g font-family="'Arial Black','Arial Narrow',sans-serif" font-weight="900" text-anchor="middle">
        <text x="320" y="254" font-size="118" fill="url(#chromeDeep)" transform="translate(2,3)">PTBL</text>
        <text x="320" y="254" font-size="118" fill="url(#chrome)" filter="url(#soft)">PTBL</text>
      </g>

      <!-- POOLTABLE -->
      <text x="320" y="300" font-family="'Arial Narrow','Arial',sans-serif" font-size="30"
            letter-spacing="26" text-anchor="middle" fill="#ffffff" font-weight="600">POOLTABLE</text>

      <!-- BREAK THE BLOCK. -->
      <text x="320" y="352" font-family="'Arial',sans-serif" font-size="20"
            letter-spacing="10" text-anchor="middle" fill="#29b6f6" font-weight="700">BREAK THE BLOCK.</text>
    </svg>
  </div>

  <div class="rack" aria-hidden="true">
    <div class="ball b8"></div>
    <div class="ball b1"></div>
    <div class="ball b2"></div>
    <div class="ball b3"></div>
    <div class="ball b4"></div>
    <div class="ball b5"></div>
    <div class="ball b6"></div>
  </div>

  <div class="spy">SPY<span>CRYPTO</span></div>

  <div class="meta">
    Public Cardano stake pool &middot; Ticker <code>PTBL</code> &middot; Mainnet
  </div>

</body>
</html>
